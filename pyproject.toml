[project]
name = "infosim"
version = "0.0.1"
description = "Prototype sandbox for the Distributed Information Strategy Simulation"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
